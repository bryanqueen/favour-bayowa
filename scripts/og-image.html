<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;1,400&family=Instrument+Serif:ital@0;1&family=La+Belle+Aurore&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --paper: #f4efe6;
    --ink: #161311;
    --muted: #6d675f;
    --clay: #c56b52;
    --clay-deep: #7a4636;
    --line: rgba(22, 19, 17, 0.16);
    --serif: 'Instrument Serif', Georgia, serif;
    --sans: 'Instrument Sans', 'Segoe UI', sans-serif;
    --script: 'La Belle Aurore', cursive;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    width: 1200px;
    height: 630px;
    overflow: hidden;
    font-family: var(--sans);
    color: var(--ink);
  }

  .canvas {
    position: relative;
    width: 1200px;
    height: 630px;
    background:
      radial-gradient(900px 520px at 4% -8%, rgba(197, 107, 82, 0.22), transparent 55%),
      radial-gradient(500px 380px at 100% 100%, rgba(197, 107, 82, 0.12), transparent 60%),
      var(--paper);
  }

  .grain {
    position: absolute;
    inset: 0;
    background-image: url('/grain.png');
    background-size: 220px 220px;
    opacity: 0.4;
    mix-blend-mode: multiply;
  }

  .frame {
    position: absolute;
    inset: 26px;
    border: 1.5px solid var(--line);
    border-radius: 20px;
  }

  .content {
    position: absolute;
    left: 74px;
    top: 0;
    bottom: 0;
    width: 640px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }

  .where {
    font-family: var(--script);
    font-size: 32px;
    color: var(--clay-deep);
    margin-bottom: 8px;
  }

  h1 {
    font-family: var(--serif);
    font-weight: 400;
    font-size: 118px;
    line-height: 0.84;
    letter-spacing: -0.04em;
    color: var(--ink);
  }

  h1 span {
    display: block;
  }

  .squiggle {
    display: block;
    width: 240px;
    height: 30px;
    margin-top: 6px;
    color: var(--clay);
  }

  .squiggle path {
    fill: none;
    stroke: currentColor;
    stroke-width: 3.6;
    stroke-linecap: round;
  }

  .eyebrow {
    margin-top: 30px;
    font-size: 15px;
    letter-spacing: 0.2em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .lede {
    margin-top: 16px;
    max-width: 30ch;
    font-size: 22px;
    line-height: 1.45;
    color: var(--ink);
  }

  .portrait-wrap {
    position: absolute;
    right: 78px;
    top: 50%;
    width: 320px;
    transform: translateY(-50%) rotate(2.2deg);
  }

  .portrait-frame {
    position: relative;
    overflow: hidden;
    width: 320px;
    aspect-ratio: 4 / 5;
    border-radius: 6px;
    background: #c98774;
    box-shadow: 0 40px 70px -28px rgba(22, 19, 17, 0.45);
  }

  .portrait-frame img {
    width: 112%;
    height: 112%;
    margin: -6% 0 0 -6%;
    object-fit: cover;
    object-position: center 18%;
    filter: saturate(1.02);
  }

  .portrait-note {
    position: absolute;
    left: 18px;
    bottom: 16px;
    font-family: var(--script);
    font-size: 30px;
    color: #fff8f3;
    text-shadow: 0 1px 8px rgba(80, 30, 20, 0.35);
  }

  .badge {
    position: absolute;
    left: -22px;
    bottom: -18px;
    background: var(--ink);
    color: var(--paper);
    font-size: 15px;
    letter-spacing: 0.02em;
    padding: 12px 18px;
    border-radius: 999px;
    transform: rotate(-4deg);
    box-shadow: 0 14px 26px -12px rgba(22, 19, 17, 0.5);
    white-space: nowrap;
  }

  .badge strong {
    font-weight: 600;
    color: #fff;
  }

</style>
</head>
<body>
  <div class="canvas">
    <div class="grain"></div>
    <div class="frame"></div>

    <div class="content">
      <p class="where">Lagos, Nigeria</p>
      <h1><span>Bayowa</span><span>Favour</span></h1>
      <svg class="squiggle" viewBox="0 0 200 20" aria-hidden="true">
        <path d="M4 12 C 24 4, 40 18, 70 10 S 120 2, 150 12 S 180 18, 196 8" />
      </svg>
      <p class="eyebrow">Content Strategist &middot; Copywriter &middot; Audience Growth</p>
      <p class="lede">I turn ideas, expertise, and products into content that earns attention, builds trust, and moves people to act.</p>
    </div>

    <div class="portrait-wrap">
      <div class="portrait-frame">
        <img src="/images/portrait.jpg" alt="" />
        <p class="portrait-note">that&rsquo;s me</p>
      </div>
      <div class="badge">100 <strong>&rarr; 6,000+</strong> LinkedIn in 8mo</div>
    </div>
  </div>
</body>
</html>
